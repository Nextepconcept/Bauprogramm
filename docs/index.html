<style>
/* Layout: planning sheet — title block on top, tabbed registers below, tables scroll inside their own frames */
:root{

  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161c; --sheet:#171e26; --ink:#e4eaf0; --muted:#98a6b4; --line:#2b3642; --soft:#1f2832;
  --accent:#6d9fd8; --vhn:#5b92d3; --vhs:#9dbbe0; --mh:#4cc08b; --hol:#1c232b;

:root[data-theme="dark"]{
  --paper:#11161c; --sheet:#171e26; --ink:#e4eaf0; --muted:#98a6b4; --line:#2b3642; --soft:#1f2832;
  --accent:#6d9fd8; --vhn:#5b92d3; --vhs:#9dbbe0; --mh:#4cc08b; --hol:#1c232b;

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header.tb{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px}
header.tb h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.2rem);letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.1}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.85rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,.btn{font:inherit;font-size:.88rem;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
section.panel{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0}
h3{font-family:var(--f-display);font-weight:700;font-size:1rem;margin:0}
p{margin:0;max-width:75ch}
.note{font-size:.88rem;color:var(--muted);max-width:90ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
ol.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.who{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);position:sticky;top:0;white-space:nowrap}
tr.grp td{background:var(--soft);font-family:var(--f-display);font-weight:700;font-size:.9rem}
td.num,td.mono{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
td.desc{min-width:260px}
td .sub{display:block;color:var(--muted);font-size:.8rem}
input:disabled,select:disabled{background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;appearance:none;-webkit-appearance:none;cursor:default}
input[type=radio]:disabled{appearance:auto;-webkit-appearance:auto}
button:disabled{display:none}
.wip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-weight:600}
select,input,textarea{font:inherit;font-size:.85rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
input.note-in{width:100%;min-width:160px}
input.wk{width:4.2em;font-family:var(--f-mono)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.chip.nx{background:var(--okbg);border-color:transparent;color:var(--ok)}
.chip.fx{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.chip.lf{background:var(--soft)}
.chip.dec{background:var(--badbg);border-color:transparent;color:var(--bad)}
.late{color:var(--bad);font-weight:700}
.soon{color:var(--warn);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* gantt */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
.g-row{display:flex;border-bottom:1px solid var(--line);min-width:max-content}
.g-lab{position:sticky;left:0;z-index:2;background:var(--sheet);width:230px;flex:none;padding:6px 10px;font-size:.84rem;border-right:1px solid var(--line);line-height:1.25}
.g-lab .sub{display:block;color:var(--muted);font-size:.74rem}
.g-track{position:relative;flex:none;min-height:46px}
.g-head .g-track{height:38px}
.g-head .g-lab{background:var(--soft);font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:flex-end}
.g-col{position:absolute;top:0;bottom:0;border-left:1px solid var(--soft)}
.g-col.hol{background:var(--hol)}
.g-col.now{border-left:2px solid var(--bad)}
.g-wk{position:absolute;bottom:3px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-align:center}
.g-mo{position:absolute;top:3px;font-family:var(--f-mono);font-size:.64rem;color:var(--ink);font-weight:600;white-space:nowrap}
.bar{position:absolute;height:10px;border-radius:2px}
.bar.N{top:6px;background:var(--vhn)} .bar.S{top:18px;background:var(--vhs)} .bar.M{top:30px;background:var(--mh)}
.gate{position:absolute;top:2px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid var(--bad)}
details.box summary{cursor:pointer;font-weight:600}
.tpl{white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;background:var(--soft);border-radius:4px;padding:12px;border:1px solid var(--line);max-height:460px;overflow:auto}
.status{font-size:.8rem;color:var(--muted)}
ul.q{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){header.tb{grid-template-columns:1fr}.ctrl{justify-content:flex-start}.g-lab{width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(lvRows),'Leistungsverzeichnis');
  const sRows=[['ID','Vorgang (DE)','Activitate (RO)','Zone','Start','Ende','Start-KW','Dauer Wo.']];
  TASKS.forEach(x=>{ const s=sched(x[0]); ['N','S','M'].forEach(z=>{ const a=calOf(s[z][0]), b=calOf(s[z][0]+s[z][1]-1); const e=new Date(monday(b)); e.setDate(e.getDate()+4); sRows.push([x[0],x[1].de,x[1].ro,T.zones[z].de,fmt(monday(a)),fmt(e),isoWk(monday(a)),s[z][1]]); }); });
  /* Bauablaufplan-Export ausgeblendet */
  const pRows=[['Paket','Leistung (DE)','Lucrare (RO)','Art','LV-Pos.','Lieferzeit Wo. (Annahme)','Status','Notiz']];
  PK.forEach(p=>{ const o=ov('P_'+p[0]); pRows.push([p[0],p[1].de,p[1].ro,T.exec[p[2]].de,p[3],p[5],T.pst.de[o.st||0],o.note||'']); });
  const uRows=[['Einheit','Zone','Geschoss','Räume','Fn m² (Zeichnung)','Hinweis','Priorität Vermietung','Notiz']];
  UNITS.forEach(u=>{ const o=ov('U_'+u[0].replace(/[^A-Za-z0-9]/g,'_')); uRows.push([u[0],T.zones[u[1]]?T.zones[u[1]].de:u[1],u[2],u[3],u[4]==null?'':u[4],u[5].de,o.grp||'',o.note||'']); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(uRows),'Wohnungen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pRows),'Anfrageliste');
  const cRows=[['Paket','Anbieter','Angebot Nr. / Datum','Gültig bis','Netto €','Lieferzeit','Abweichungen / Bemerkung','Quelle','Empfehlung Tudor','Auswahl Johan']];
  PK.forEach(p=>{ const o=ov('O_'+p[0]); (o.o||[]).forEach((x,i)=>{ if(x.f||x.n) cRows.push([p[0],x.f||'',x.nr||'',x.g||'',x.n||'',x.l||'',x.b||'',x.src||'',o.rec===i?'x':'',o.pick===i?'x':'']); }); });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cRows),'Preisspiegel');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  xlsxDl.save({filename:'Bauprogramm_Etappe2_VH-MH.xlsx',data:new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}).catch(err=>{ if(err&&err.code!=='cancelled'&&err.code!=='declined') document.getElementById('sync').textContent=t('xlsFail'); });
}

render();

/* ---------- Daten aus data.json laden (statische Version) ---------- */
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{ OV=d||{}; render(); }).catch(()=>{ document.getElementById('sync').textContent='data.json konnte nicht geladen werden.'; });
})();
</script>
